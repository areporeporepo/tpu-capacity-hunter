# Candidate slices, in priority order: zone, accelerator type, runtime version.
# Runtime is optional (a sane default is derived from the accelerator family).
#
# Order matters. Put same-region-as-your-data zones first, because a TPU in
# us-east5 reading a checkpoint out of a us-west4 bucket pays cross-region
# egress on every load.
#
# Empirical notes, soe-hpccenter, 2026-08-14:
#   us-west4-a    v5e quota 32/32, fully consumed by 4 x v5litepod-8 peers
#   us-west4-b    v5e quota free, but "Insufficient capacity"
#   us-east5-b    v6e single chips available; v6e-4 and v6e-8 both roll back
#   us-east4-a    v6e quota limit 0 (no grant)
#   us-east5-c    v6e quota limit 0 (no grant)

# --- v5e, same region as the me344 bucket (gs://me344-tpu-labs-west4) ---
us-west4-a	v5litepod-8	tpu-ubuntu2204-base
us-west4-b	v5litepod-8	tpu-ubuntu2204-base

# --- v5e, other regions that hold class GKE clusters ---
us-central1-a	v5litepod-8	tpu-ubuntu2204-base
us-east5-a	v5litepod-8	tpu-ubuntu2204-base
us-east5-b	v5litepod-8	tpu-ubuntu2204-base
us-south1-a	v5litepod-8	tpu-ubuntu2204-base
europe-west4-b	v5litepod-8	tpu-ubuntu2204-base

# --- v5e, smaller slices: worse for a 4B full finetune, but far easier to
#     schedule when hosts are fragmented ---
us-west4-a	v5litepod-4	tpu-ubuntu2204-base
us-central1-a	v5litepod-4	tpu-ubuntu2204-base
us-east5-b	v5litepod-4	tpu-ubuntu2204-base

# --- v6e, only the zones that actually carry a nonzero grant ---
us-east5-b	v6e-8	v2-alpha-tpuv6e
us-east5-a	v6e-8	v2-alpha-tpuv6e
us-central1-b	v6e-8	v2-alpha-tpuv6e
us-east5-b	v6e-4	v2-alpha-tpuv6e
us-east5-b	v6e-1	v2-alpha-tpuv6e
